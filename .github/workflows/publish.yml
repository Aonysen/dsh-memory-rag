name: publish

# Trusted publishing (OIDC): no long-lived npm token needed.
# One-time setup after the first manual publish:
#   npmjs.com → package → Settings → Trusted publishing → GitHub Actions
#   owner: aonysen · repository: dsh-memory-rag · workflow: publish.yml
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Unit tests
        run: node --test
      - name: Publish to npm
        run: npm publish --access public
